import java.nio.charset.Charset

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath "org.gebish:markdown2book:1.0"
    }
}

def jvmEncoding = Charset.defaultCharset().name()
if (jvmEncoding != "UTF-8") {
    throw new IllegalStateException("Build environment must be UTF-8 (it is: $jvmEncoding) - add '-Dfile.encoding=UTF-8' to the GRADLE_OPTS environment variable ")
}

allprojects {
    version = "${appVersion}"
    group   = "${appGroup}"

    ext {
        isSnapshot = version.endsWith("SNAPSHOT")
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    tasks.withType(Test) {
        useJUnitPlatform()
    }

    tasks.withType(GroovyCompile) {
        configure(groovyOptions) {
            forkOptions.jvmArgs = ['-Xmx1024m']
        }
    }
}

def groovyModules = [
    ":module:remote-core", ":module:remote-transport-local", ":module:remote-transport-http"
]

def publishedModules = [
    ":module:remote-core", ":module:remote-transport-local", ":module:remote-transport-http"
]

def publishedGroovyModules = groovyModules.findAll { it in publishedModules }

subprojects {
    // Compile, test and document every JVM module with the Java version from gradle.properties
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(javaVersion as int)
            }
        }
    }

    if (project.path in groovyModules) {
        apply plugin: "groovy"
        apply plugin: "codenarc"

        codenarc {
            // CodeNarc 4.x is built against Groovy 5 (Gradle's default CodeNarc targets an older Groovy)
            toolVersion = codenarcVersion
            configFile = rootProject.file("config/codenarc/codenarc.xml")
        }

        tasks.withType(Test) {
            useJUnitPlatform()
        }

        test {
            // Enable reflection, which is utilized during the remote execution
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
        }

        tasks.withType(GroovyCompile) {
            configure(groovyOptions) {
                forkOptions.jvmArgs = ['-Xmx1024m']
            }
        }
    }

    if (project.path in publishedModules) {
        // Sources and javadoc jars come from java { withSourcesJar(); withJavadocJar() } in each module's build.gradle
        apply plugin: 'maven-publish'
    }
}

project(':module:remote-using-lib') {
    apply plugin: "groovy"

    dependencies {
        implementation "org.apache.groovy:groovy-all:${groovyVersion}"
        implementation project(":module:remote-core")
    }
}

project(":doc:manual") {
    ext {
        src = file("src")
        output = file("build/manual")
    }

    // Generate the manual at execution time (not while the build is being configured)
    def compileManual = tasks.register("compile") {
        def srcDir = src
        def outputDir = output
        inputs.dir(srcDir)
        doLast {
            new markdown2book.Generator(srcDir, outputDir, "UTF-8").generate()
        }
    }

    // Copies each published module's API docs (taken from its groovydoc/javadoc task, which creates the
    // task dependency) into <output>/<apiDirName>/<module name>. Runs after the manual so it can't be overwritten.
    def registerApiDocCopy = { String taskName, String docTaskName, String apiDirName ->
        tasks.register(taskName, Sync) {
            mustRunAfter compileManual
            into new File(output, apiDirName)
            publishedGroovyModules.each { module ->
                def baseName = module.substring(module.lastIndexOf(":") + 1)
                from(project(module).tasks.named(docTaskName)) {
                    into baseName
                }
            }
        }
    }

    def copyGroovyDoc = registerApiDocCopy("copyGroovyDoc", "groovydoc", "groovy-api")
    def copyJavaDoc = registerApiDocCopy("copyJavaDoc", "javadoc", "java-api")

    tasks.register("assemble") {
        dependsOn compileManual, copyGroovyDoc, copyJavaDoc
    }
}

project(":doc:site") {
    ext {
        src = file("src")
        output = file("build/site")
        manualDir = file("$output/manual")
        thisManual = file("$manualDir/$project.version")
    }

    tasks.register("clean") {
        doLast {
            if (output.exists()) {
                assert output.deleteDir()
            }
        }
    }

    def includeManual = tasks.register("includeManual", Sync) {
        dependsOn project(":doc:manual").tasks.named("assemble")
        from project(":doc:manual").output
        into project.thisManual

        doLast {
            ant.symlink link: "${manualDir.path}/latest", resource: thisManual.path, overwrite: true
        }
    }

    def copySrc = tasks.register("copySrc", Copy) {
        from src
        into output
    }

    tasks.register("compile") {
        dependsOn copySrc, includeManual
    }
}

